<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Busca por Foto</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.1/dist/tesseract.min.js"></script>

<body>
  <header class="topo">
    <a href="index.html" class="btn-voltar-topo">←</a>
    <h1>Busca por Foto</h1>

  <main class="card" style="text-align:center">
    <input type="file" accept="image/*" id="imagemFoto" capture="environment" />

    <div id="ocrResultado"></div>
    <section id="resultado" class="card"></section>
  </main>

  </footer>
